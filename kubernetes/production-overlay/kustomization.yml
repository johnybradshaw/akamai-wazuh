# ============================================================================
# Akamai Cloud Wazuh Quick-Start - Production Overlay
# ============================================================================
# This Kustomize configuration creates a production-ready Wazuh deployment:
#   - Uses ClusterIP for internal services
#   - Creates LoadBalancers only for manager and worker services
#   - Configures ingress with TLS for dashboard
#   - Sets appropriate resource limits
#   - Manages secrets and certificates
# ============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace for all resources
namespace: wazuh

# Base resources from wazuh-kubernetes repository
resources:
  # Namespace
  - ../wazuh-kubernetes/wazuh/base/wazuh-ns.yaml

  # Indexer (OpenSearch) components
  - ../wazuh-kubernetes/wazuh/indexer_stack/wazuh-indexer/cluster/indexer-api-svc.yaml
  - ../wazuh-kubernetes/wazuh/indexer_stack/wazuh-indexer/cluster/indexer-sts.yaml
  - ../wazuh-kubernetes/wazuh/indexer_stack/wazuh-indexer/indexer-svc.yaml

  # Dashboard components
  - ../wazuh-kubernetes/wazuh/indexer_stack/wazuh-dashboard/dashboard-deploy.yaml
  - ../wazuh-kubernetes/wazuh/indexer_stack/wazuh-dashboard/dashboard-svc.yaml

  # Manager components
  - ../wazuh-kubernetes/wazuh/wazuh_managers/wazuh-master-sts.yaml
  - ../wazuh-kubernetes/wazuh/wazuh_managers/wazuh-worker-sts.yaml
  - ../wazuh-kubernetes/wazuh/wazuh_managers/wazuh-cluster-svc.yaml
  - ../wazuh-kubernetes/wazuh/wazuh_managers/wazuh-master-svc.yaml
  - ../wazuh-kubernetes/wazuh/wazuh_managers/wazuh-workers-svc.yaml

  # Secrets
  - ../wazuh-kubernetes/wazuh/secrets/wazuh-api-cred-secret.yaml
  - ../wazuh-kubernetes/wazuh/secrets/wazuh-authd-pass-secret.yaml
  - ../wazuh-kubernetes/wazuh/secrets/wazuh-cluster-key-secret.yaml
  - ../wazuh-kubernetes/wazuh/secrets/dashboard-cred-secret.yaml
  - ../wazuh-kubernetes/wazuh/secrets/indexer-cred-secret.yaml

  # Custom resources for production
  - manager-loadbalancers.yaml
  - ingress.yaml

# Generated certificate and configuration inputs. Certificate material and
# internal_users.yml are created by deploy.sh and deliberately ignored by Git.
secretGenerator:
  - name: indexer-certs
    files:
      - ../wazuh-kubernetes/wazuh/certs/indexer_cluster/root-ca.pem
      - ../wazuh-kubernetes/wazuh/certs/indexer_cluster/node.pem
      - ../wazuh-kubernetes/wazuh/certs/indexer_cluster/node-key.pem
      - ../wazuh-kubernetes/wazuh/certs/indexer_cluster/dashboard.pem
      - ../wazuh-kubernetes/wazuh/certs/indexer_cluster/dashboard-key.pem
      - ../wazuh-kubernetes/wazuh/certs/indexer_cluster/admin.pem
      - ../wazuh-kubernetes/wazuh/certs/indexer_cluster/admin-key.pem
      - ../wazuh-kubernetes/wazuh/certs/indexer_cluster/filebeat.pem
      - ../wazuh-kubernetes/wazuh/certs/indexer_cluster/filebeat-key.pem
  - name: dashboard-certs
    files:
      - ../wazuh-kubernetes/wazuh/certs/dashboard_http/cert.pem
      - ../wazuh-kubernetes/wazuh/certs/dashboard_http/key.pem
      - ../wazuh-kubernetes/wazuh/certs/indexer_cluster/root-ca.pem
configMapGenerator:
  - name: indexer-conf
    files:
      - opensearch.yml=../wazuh-kubernetes/wazuh/indexer_stack/wazuh-indexer/indexer_conf/opensearch.yml
      - internal_users.yml
  - name: wazuh-conf
    files:
      - ../wazuh-kubernetes/wazuh/wazuh_managers/wazuh_conf/master.conf
      - ../wazuh-kubernetes/wazuh/wazuh_managers/wazuh_conf/worker.conf
  - name: dashboard-conf
    files:
      - ../wazuh-kubernetes/wazuh/indexer_stack/wazuh-dashboard/dashboard_conf/opensearch_dashboards.yml

# Patches to customize the deployment
patches:
  # Convert default LoadBalancer services to ClusterIP. This file contains
  # multiple strategic-merge patches, each with its own resource identity.
  - path: service-patches.yaml

  # Resource limits for manager master
  - path: manager-master-resources.yaml
    target:
      kind: StatefulSet
      name: wazuh-manager-master

  # Resource limits for manager workers
  - path: manager-worker-resources.yaml
    target:
      kind: StatefulSet
      name: wazuh-manager-worker

  # Resource limits for indexer
  - path: indexer-resources.yaml
    target:
      kind: StatefulSet
      name: wazuh-indexer

  # Resource limits for dashboard
  - path: dashboard-resources.yaml
    target:
      kind: Deployment
      name: wazuh-dashboard

  # Generated credentials replace the upstream defaults. These files are
  # emitted by generate-credentials.sh and deliberately ignored by Git.
  - path: indexer-cred.patch.yaml
    target:
      kind: Secret
      name: indexer-cred
  - path: dashboard-cred.patch.yaml
    target:
      kind: Secret
      name: dashboard-cred
  - path: wazuh-api-cred.patch.yaml
    target:
      kind: Secret
      name: wazuh-api-cred
  - path: wazuh-authd-pass.patch.yaml
    target:
      kind: Secret
      name: wazuh-authd-pass
  - path: wazuh-cluster-key.patch.yaml
    target:
      kind: Secret
      name: wazuh-cluster-key

# Images (can be overridden for specific versions)
# DHI BusyBox is applied to all upstream and overlay init containers. The
# matching security-context patch keeps the root-required maintenance actions
# functional while the image defaults to a non-root user.
images:
  - name: busybox
    newName: dhi.io/busybox
    newTag: 1.37-alpine3.23
  - name: wazuh/wazuh-indexer
    newTag: 4.14.5
  - name: wazuh/wazuh-manager
    newTag: 4.14.5
  - name: wazuh/wazuh-dashboard
    newTag: 4.14.5

# Configuration for replica counts (can be overridden)
replicas:
  - name: wazuh-manager-worker
    count: 2
  - name: wazuh-indexer
    count: 3
