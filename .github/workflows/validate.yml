name: Validate deployment configuration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate scripts and manifests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and pinned manifests
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install kubectl with Kustomize
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.3

      - name: Check repository shell syntax
        shell: bash
        run: |
          set -euo pipefail
          find . \
            \( -path './.git' -o -path './kubernetes/wazuh-kubernetes' \) -prune -o \
            -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Run deployment-helper unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Prepare non-sensitive generated inputs
        shell: bash
        run: |
          set -euo pipefail
          overlay=kubernetes/production-overlay
          cert_dir=kubernetes/wazuh-kubernetes/wazuh/certs

          # These ignored files are normally generated by deploy.sh. Test-only
          # fixtures allow Kustomize validation without production credentials.
          cat > "$overlay/internal_users.yml" <<'EOF'
          _meta:
            type: internalusers
            config_version: 2
          EOF

          mkdir -p "$cert_dir/indexer_cluster" "$cert_dir/dashboard_http"
          for file in \
            indexer_cluster/root-ca.pem \
            indexer_cluster/node.pem \
            indexer_cluster/node-key.pem \
            indexer_cluster/dashboard.pem \
            indexer_cluster/dashboard-key.pem \
            indexer_cluster/admin.pem \
            indexer_cluster/admin-key.pem \
            indexer_cluster/filebeat.pem \
            indexer_cluster/filebeat-key.pem \
            dashboard_http/cert.pem \
            dashboard_http/key.pem; do
            printf 'validation fixture\n' > "$cert_dir/$file"
          done

          # The placeholder value is encoded at run time rather than committed as
          # a base64 literal, so secret scanners do not report these fixtures as
          # hardcoded credentials.
          fixture_value="$(printf 'validation-fixture' | base64)"

          create_secret_patch() {
            local filename="$1" secret_name="$2"
            shift 2
            {
              printf 'apiVersion: v1\nkind: Secret\nmetadata:\n  name: %s\ndata:\n' "$secret_name"
              for key in "$@"; do
                printf '  %s: %s\n' "$key" "$fixture_value"
              done
            } > "$overlay/$filename"
          }
          create_secret_patch indexer-cred.patch.yaml indexer-cred username password
          create_secret_patch dashboard-cred.patch.yaml dashboard-cred username password
          create_secret_patch wazuh-api-cred.patch.yaml wazuh-api-cred username password
          create_secret_patch wazuh-authd-pass.patch.yaml wazuh-authd-pass authd.pass
          create_secret_patch wazuh-cluster-key.patch.yaml wazuh-cluster-key key

      - name: Render the active deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          kubectl kustomize kubernetes > rendered-active.yaml

      - name: Render the standalone production overlay
        shell: bash
        run: |
          set -euo pipefail
          kubectl kustomize --load-restrictor LoadRestrictionsNone \
            kubernetes/production-overlay > rendered-production.yaml

      - name: Verify Docker Hardened Image substitutions
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -Fc 'image: dhi.io/busybox:1.37-alpine3.23' rendered-active.yaml)" -eq 3
          test "$(grep -Fc 'image: dhi.io/busybox:1.37-alpine3.23' rendered-production.yaml)" -eq 3
          grep -Fqx '        image: dhi.io/external-dns:0.21.0-alpine3.23' \
            kubernetes/scripts/install-prerequisites.sh
